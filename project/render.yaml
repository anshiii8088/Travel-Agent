services:
  - type: web
    name: ai-smart-travel-planner-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    disk:
      name: travel-planner-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: MOCK_LLM
        value: "True"
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        value: sqlite:////var/data/travel_planner.db
